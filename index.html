<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КОМФОРТ МЕБЕЛЬ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1219">
<title>КОМФОРТ МЕБЕЛЬ — Раскрой + 3D Кухня</title>
<style>
:root {
  --bg: #0f1219;
  --panel: #171b26;
  --card: #1e2433;
  --border: #2a3144;
  --text: #e8ecf4;
  --muted: #8b95a8;
  --accent: #5c7cfa;
  --accent2: #748ffc;
  --success: #51cf66;
  --danger: #ff6b6b;
  --warning: #fcc419;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: 100dvh; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text);
}
/* iOS Safari: remove 300ms delay + make elements properly tappable */
button, a, [onclick], .btn, .tab, .module-btns button, .mod-item,
.k-controls button, label.btn, .mod-item .actions button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(92, 124, 250, 0.3);
  -webkit-user-select: none;
  user-select: none;
  cursor: pointer;
}
button {
  font-family: inherit; border: none; outline: none; -webkit-appearance: none;
}
input, select { font-family: inherit; font-size: 16px; } /* 16px = no iOS zoom on focus */

/* Header */
.header {
  height: calc(52px + var(--safe-top)); padding: var(--safe-top) 16px 0;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  padding-left: max(16px, var(--safe-left)); padding-right: max(16px, var(--safe-right));
  position: relative; z-index: 50;
}
.logo { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; white-space: nowrap; }
.logo span { color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; border-radius: 8px; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 500; transition: .15s; white-space: nowrap;
}
.tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
.tab.active { background: var(--accent); color: #fff; }

/* Layout */
.app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
.main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.panel { display: none; flex: 1; overflow: hidden; min-height: 0; width: 100%; }
.panel.active { display: flex; }

/* ========== CUTTING TOOL ========== */
#panel-cut { flex-direction: column; }
.cut-toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); align-items: center;
}
.cut-toolbar label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.cut-toolbar input, .cut-toolbar select {
  width: 90px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px;
}
.cut-toolbar .wide { width: 140px; }
.btn {
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: var(--card); color: var(--text); border: 1px solid var(--border); transition: .15s;
}
.btn:hover { background: #252c3d; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.cut-body { flex: 1; display: flex; overflow: hidden; }
.cut-sidebar {
  width: 320px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.cut-sidebar h3 { padding: 12px 16px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.parts-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.part-card {
  background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  border: 1px solid var(--border);
}
.part-card .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.part-card input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; }
.part-card .name { flex: 2; }
.cut-canvas-wrap { flex: 1; position: relative; background: #0c0e14; overflow: hidden; }
#cutCanvas { width: 100%; height: 100%; display: block; }
.cut-stats {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  background: rgba(23,27,38,.92); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; font-size: 12px; color: var(--muted); backdrop-filter: blur(8px);
}
.cut-stats strong { color: var(--text); }
.sheet-nav { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

/* ========== KITCHEN 3D — fullscreen canvas ========== */
#panel-kitchen { flex-direction: column; min-height: 0; position: relative; }
.k-canvas-wrap {
  flex: 1; min-width: 0; min-height: 0; position: relative; background: #0c0e14;
  /* leave room for bottom bar on phones */
  padding-bottom: 0;
}
#kitchenCanvas {
  width: 100%; height: 100%; display: block; cursor: grab;
  touch-action: none; -webkit-user-select: none; user-select: none;
}
#kitchenCanvas:active { cursor: grabbing; }

/* Controls are OUTSIDE the canvas stacking context — critical for iOS Safari */
.k-controls {
  position: absolute;
  top: 10px;
  right: max(10px, var(--safe-right));
  display: flex; flex-direction: column; gap: 8px;
  z-index: 500;
  pointer-events: none; /* container ignores hits; children re-enable */
}
.k-controls a, .k-controls .k-btn {
  pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; min-width: 48px; min-height: 48px;
  border-radius: 14px;
  background: #243044;
  border: 1px solid #3d4a63;
  color: #fff;
  font-size: 18px;
  text-decoration: none;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(92,124,250,.4);
  -webkit-user-select: none; user-select: none;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.k-controls a:active, .k-controls .k-btn:active { background: var(--accent); border-color: var(--accent); }
.k-controls a.accent, .k-controls .k-btn.accent {
  background: var(--accent); border-color: var(--accent);
}
.k-controls .sep { height: 1px; background: #3d4a63; margin: 2px 12px; pointer-events: none; }

/* Bottom action bar — always works on iPhone (native-like) */
.k-bottom-bar {
  display: none;
  flex-shrink: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 8px 10px calc(8px + var(--safe-bottom));
  gap: 8px;
  justify-content: space-around;
  align-items: center;
  z-index: 500;
  position: relative;
}
.k-bottom-bar a {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  min-height: 52px;
  padding: 6px 4px;
  border-radius: 12px;
  background: #1e2433;
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  font-size: 11px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(92,124,250,.35);
  -webkit-user-select: none; user-select: none;
}
.k-bottom-bar a span.icon { font-size: 20px; line-height: 1; }
.k-bottom-bar a.accent {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.k-hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(23,27,38,.85); padding: 6px 14px; border-radius: 20px;
  font-size: 11px; color: var(--muted); border: 1px solid var(--border); pointer-events: none;
  max-width: calc(100% - 120px); text-align: center; z-index: 2;
}
@media (max-width: 700px) {
  .k-bottom-bar { display: flex; }
  .k-controls { display: none; } /* phone: use bottom bar only */
  .k-hint { display: none; }
}
@media (min-width: 701px) {
  .k-bottom-bar { display: none; }
}

/* Module buttons grid inside dialogs */
.module-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.module-btns button {
  padding: 10px 8px; border-radius: 8px; font-size: 13px; background: var(--card);
  border: 1px solid var(--border); color: var(--text); transition: .12s;
}
.module-btns button:hover { background: #2a3144; border-color: var(--accent); }

.modules-list { overflow-y: auto; max-height: 50vh; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.mod-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  background: var(--card); border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border);
  font-size: 12px; cursor: pointer; transition: .15s;
}
.mod-item:hover { border-color: var(--accent); background: #252c3d; }
.mod-item .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.mod-item .info { flex: 1; min-width: 0; }
.mod-item .info .title { font-weight: 600; font-size: 13px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-item .info .meta { color: var(--muted); font-size: 11px; line-height: 1.35; }
.mod-item .actions { display: flex; flex-direction: column; gap: 4px; }
.mod-item .actions button { padding: 4px 8px; font-size: 11px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
  align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  width: 92%; max-width: 440px;
  max-height: min(88vh, calc(100dvh - var(--safe-top) - var(--safe-bottom) - 24px));
  overflow-y: auto; padding: 18px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.modal.wide { max-width: 520px; }
.modal h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal h2 .close-x { background: transparent; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1; min-width: 36px; min-height: 36px; }
.modal h2 .close-x:hover { color: var(--text); }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.form-row input, .form-row select {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 16px;
}
.form-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.form-actions .btn { min-height: 44px; padding: 10px 16px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; min-height: 44px; }

/* Toast */
.toast {
  position: fixed; bottom: max(24px, calc(var(--safe-bottom) + 12px)); left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--card); border: 1px solid var(--border); padding: 10px 20px;
  border-radius: 10px; font-size: 13px; z-index: 200; transition: .3s; opacity: 0;
  max-width: calc(100% - 32px);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ===== Responsive: tablet ===== */
@media (max-width: 900px) {
  .cut-sidebar { width: 260px; }
  .cut-toolbar input { width: 72px; }
  .logo { font-size: 14px; }
  .tab { padding: 7px 12px; font-size: 13px; }
}

/* ===== Responsive: phone ===== */
@media (max-width: 700px) {
  .header { height: calc(48px + var(--safe-top)); gap: 6px; }
  .logo { font-size: 13px; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
  .tabs { margin-left: 4px; gap: 3px; }
  .tab { padding: 6px 10px; font-size: 12px; }
  .main { flex-direction: column; }
  .cut-body { flex-direction: column; }
  .cut-sidebar {
    width: 100%; max-height: 38vh;
    border-right: none; border-bottom: 1px solid var(--border);
  }
  .cut-toolbar { padding: 8px 10px; gap: 6px; }
  .cut-toolbar label { font-size: 11px; }
  .cut-toolbar input, .cut-toolbar select { width: 64px; font-size: 14px; padding: 6px; }
  .cut-stats { bottom: max(8px, var(--safe-bottom)); left: 8px; right: 8px; font-size: 11px; padding: 8px 10px; }
  .module-btns { grid-template-columns: 1fr 1fr; gap: 8px; }
  .module-btns button { padding: 12px 8px; font-size: 13px; min-height: 48px; }
  .modal { width: 96%; border-radius: 14px; padding: 16px; }
  .modules-list { max-height: 45vh; }
  .mod-item { padding: 12px; min-height: 52px; }
  .mod-item .actions button { min-width: 36px; min-height: 36px; }
}

/* Landscape phone */
@media (max-width: 900px) and (orientation: landscape) {
  .header { height: calc(40px + var(--safe-top)); }
  .k-hint { display: none; }
  .k-bottom-bar a { min-height: 44px; font-size: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">КОМФОРТ <span>МЕБЕЛЬ</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="cut">📐 Раскрой</button>
      <button class="tab" data-tab="kitchen">🏠 Кухня 3D</button>
    </div>
  </div>

  <!-- ========== CUTTING PANEL ========== -->
  <div class="main">
    <div id="panel-cut" class="panel active">
      <div class="cut-toolbar">
        <label>Лист Д</label><input type="number" id="sheetL" value="2800">
        <label>Ш</label><input type="number" id="sheetW" value="2070">
        <label>Пропил</label><input type="number" id="kerf" value="4">
        <label>Отступ</label><input type="number" id="padding" value="10">
        <label>Метод</label>
        <select id="method" class="wide">
          <option value="0">По длине</option>
          <option value="1">По ширине</option>
          <option value="2" selected>Оптимальный</option>
        </select>
        <button class="btn btn-primary" onclick="calculateCut()">Рассчитать</button>
        <button class="btn" onclick="exportCutPng()">PNG</button>
      </div>
      <div class="cut-body">
        <div class="cut-sidebar">
          <h3>Детали</h3>
          <div class="parts-list" id="partsList"></div>
          <div style="padding:12px">
            <button class="btn btn-primary" style="width:100%" onclick="addPartRow()">+ Добавить деталь</button>
          </div>
        </div>
        <div class="cut-canvas-wrap">
          <canvas id="cutCanvas"></canvas>
          <div class="cut-stats" id="cutStats">Добавьте детали и нажмите «Рассчитать»</div>
        </div>
      </div>
    </div>

    <!-- ========== KITCHEN PANEL (fullscreen) ========== -->
    <div id="panel-kitchen" class="panel">
      <div class="k-canvas-wrap">
        <canvas id="kitchenCanvas"></canvas>
        <div class="k-hint">Палец — вращение · щипок — масштаб</div>
      </div>
      <!-- Outside canvas: iOS Safari reliably taps <a href="javascript:void(0)"> -->
      <div class="k-controls">
        <a href="javascript:void(0)" onclick="setKitchenView(0);return false;" title="Сверху">⬆</a>
        <a href="javascript:void(0)" onclick="setKitchenView(1);return false;" title="Спереди">▢</a>
        <a href="javascript:void(0)" onclick="setKitchenView(2);return false;" title="Изометрия">◈</a>
        <a href="javascript:void(0)" onclick="resetKitchenCam();return false;" title="Сброс">↺</a>
        <div class="sep"></div>
        <a href="javascript:void(0)" class="accent" onclick="openListDialog();return false;" title="Список">☰</a>
        <a href="javascript:void(0)" onclick="openAddDialog();return false;" title="Добавить">＋</a>
        <a href="javascript:void(0)" onclick="openSaveDialog();return false;" title="Сохранить проект">💾</a>
        <a href="javascript:void(0)" onclick="openProjectsDialog();return false;" title="Мои проекты">📂</a>
      </div>
      <!-- Phone bottom bar (always tappable on iOS) -->
      <div class="k-bottom-bar">
        <a href="javascript:void(0)" class="accent" onclick="openListDialog();return false;"><span class="icon">☰</span>Список</a>
        <a href="javascript:void(0)" onclick="openAddDialog();return false;"><span class="icon">＋</span>Добавить</a>
        <a href="javascript:void(0)" onclick="openSaveDialog();return false;"><span class="icon">💾</span>Сохранить</a>
        <a href="javascript:void(0)" onclick="openProjectsDialog();return false;"><span class="icon">📂</span>Открыть</a>
      </div>
    </div>
  </div>
</div>

<!-- Modal for module settings -->
<div class="modal-overlay" id="moduleModal">
  <div class="modal">
    <h2><span id="modalTitle">Модуль</span><button class="close-x" onclick="closeModal()">×</button></h2>
    <div id="modalBody"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="modalSaveBtn">Сохранить</button>
    </div>
  </div>
</div>

<!-- Dialog: list of cabinets -->
<div class="modal-overlay" id="listModal">
  <div class="modal wide">
    <h2>Список шкафов <button class="close-x" onclick="closeListDialog()">×</button></h2>
    <div class="modules-list" id="modulesList"></div>
    <div class="form-actions" style="justify-content:space-between">
      <button class="btn btn-sm" onclick="clearKitchen()">Очистить всё</button>
      <button class="btn btn-primary" onclick="closeListDialog()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Dialog: save project with name -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h2>Сохранить проект <button class="close-x" onclick="closeSaveDialog()">×</button></h2>
    <div class="form-row">
      <label>Имя проекта</label>
      <input type="text" id="saveProjectName" placeholder="Например: Кухня Ивановых" maxlength="60">
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Сохранится в этом браузере. Чтобы отправить другу — нажмите «Скачать файл».</p>
    <div class="form-actions" style="justify-content:space-between;flex-wrap:wrap">
      <button class="btn" onclick="downloadKitchenJson()">⬇ Скачать файл</button>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="closeSaveDialog()">Отмена</button>
        <button class="btn btn-primary" onclick="saveNamedProject()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Dialog: open / manage projects -->
<div class="modal-overlay" id="projectsModal">
  <div class="modal wide">
    <h2>Мои проекты <button class="close-x" onclick="closeProjectsDialog()">×</button></h2>
    <div id="projectsList" class="modules-list"></div>
    <div class="form-actions" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
      <label class="btn" style="cursor:pointer">⬆ Открыть файл друга
        <input type="file" accept=".json,application/json" style="display:none" onchange="uploadKitchenJson(event)">
      </label>
      <button class="btn btn-primary" onclick="closeProjectsDialog()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Dialog: add module -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Добавить модуль <button class="close-x" onclick="closeAddDialog()">×</button></h2>
    <div class="module-btns">
      <button onclick="closeAddDialog();addKitchenModule(0)">Нижний шкаф</button>
      <button onclick="closeAddDialog();addKitchenModule(1)">Верхний шкаф</button>
      <button onclick="closeAddDialog();addKitchenModule(2)">Антресоль</button>
      <button onclick="closeAddDialog();addKitchenModule(3)">Ящики</button>
      <button onclick="closeAddDialog();addKitchenModule(12)">Пенал</button>
      <button onclick="closeAddDialog();addKitchenModule(4)">Духовка</button>
      <button onclick="closeAddDialog();addKitchenModule(5)">СВЧ</button>
      <button onclick="closeAddDialog();addKitchenModule(6)">Холодильник</button>
      <button onclick="closeAddDialog();addKitchenModule(7)">Вытяжка</button>
      <button onclick="closeAddDialog();addKitchenModule(8)">Посудомойка</button>
      <button onclick="closeAddDialog();addKitchenModule(9)">Столешница</button>
      <button onclick="closeAddDialog();addKitchenModule(10)">Мойка</button>
      <button onclick="closeAddDialog();addKitchenModule(11)">Варочная</button>
      <button onclick="closeAddDialog();addKitchenModule(13)">Фартук</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   UTILS
   ============================================================ */
function $(id) { return document.getElementById(id); }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function parseNum(v, def) { const n = parseFloat(v); return isNaN(n) ? def : n; }

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('panel-' + btn.dataset.tab).classList.add('active');

let parts = [
  { name: 'Боковина', length: 700, width: 500, count: 2 },
  { name: 'Полка', length: 600, width: 480, count: 4 },
  { name: 'Дверка', length: 715, width: 395, count: 2 }
];
let sheets = [];
let currentSheet = 0;
const COLORS = ['#C8E6C9','#B2EBF2','#F8BBD0','#FFE082','#FFCC80','#D1C4E9','#DCEDC8','#FFF9C4'];

function renderPartsList() {

    const card = document.createElement('div');

    card.innerHTML = `

      </div>

        <input type="number" value="${p.width}" placeholder="Ширина" onchange="parts[${i}].width=+this.value">

}
function addPartRow() {
  parts.push({ name: 'Деталь ' + (parts.length + 1), length: 500, width: 300, count: 1 });
  renderPartsList();
}

function calculateCut() {
  const sheetL = parseNum($('sheetL').value, 2800);
  const sheetW = parseNum($('sheetW').value, 2070);
  const kerf = parseNum($('kerf').value, 4);
  const padding = parseNum($('padding').value, 10);
  const method = +$('method').value;
  const usableL = sheetL - 2 * padding;
  const usableW = sheetW - 2 * padding;

  sheets = [];
  let cur = { sheetLength: sheetL, sheetWidth: sheetW, parts: [] };
  let curX = padding, curY = padding, maxRowH = 0;

  for (const part of parts) {
    for (let k = 0; k < part.count; k++) {
      let pW = part.length, pH = part.width, rotated = false;
      if (method === 1) { pW = part.width; pH = part.length; rotated = true; }
      else if (method === 2) {
        if (curX + pW > usableL + padding && curX + part.width <= usableL + padding) {
          pW = part.width; pH = part.length; rotated = true;
        }
      }
      if (curX + pW > usableL + padding) {
        curX = padding; curY += maxRowH + kerf; maxRowH = 0;
      }
      if (curY + pH > usableW + padding) {
        if (cur.parts.length) sheets.push(cur);
        cur = { sheetLength: sheetL, sheetWidth: sheetW, parts: [] };
        curX = padding; curY = padding; maxRowH = 0;
      }
      cur.parts.push({ name: part.name, x: curX, y: curY, width: pW, height: pH, rotated });
      curX += pW + kerf;
      if (pH > maxRowH) maxRowH = pH;
    }
  }
  if (cur.parts.length) sheets.push(cur);
  currentSheet = 0;
  drawCutSheet();
  updateCutStats();
}

function updateCutStats() {
  const el = $('cutStats');
  if (!sheets.length) { el.innerHTML = 'Нет результатов'; return; }
  const s = sheets[currentSheet];
  const totalA = (s.sheetLength * s.sheetWidth) / 1e6;
  let partsA = 0;
  s.parts.forEach(p => partsA += (p.width * p.height) / 1e6);
  const waste = totalA - partsA;
  const eff = totalA > 0 ? (partsA / totalA * 100) : 0;
  el.innerHTML = `
    <strong>Лист ${currentSheet + 1} из ${sheets.length}</strong> &nbsp;|&nbsp;
    Площадь: ${totalA.toFixed(2)} м² &nbsp;|&nbsp; Детали: ${partsA.toFixed(2)} м² &nbsp;|&nbsp;
    Отходы: ${waste.toFixed(2)} м² &nbsp;|&nbsp; Эффективность: <strong style="color:var(--success)">${eff.toFixed(1)}%</strong>
    <div class="sheet-nav">
      <button class="btn btn-sm" onclick="if(currentSheet>0){currentSheet--;drawCutSheet();updateCutStats()}">◀</button>
      <button class="btn btn-sm" onclick="if(currentSheet<sheets.length-1){currentSheet++;drawCutSheet();updateCutStats()}">▶</button>
    </div>`;
}

function drawCutSheet() {
  const canvas = $('cutCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  ctx.fillStyle = '#0c0e14';
  ctx.fillRect(0, 0, W, H);
  if (!sheets.length) return;
  const s = sheets[currentSheet];
  const margin = 30;
  const titleH = 28;
  const availW = W - 2 * margin;
  const availH = H - 2 * margin - titleH - 60;
  const scale = Math.min(availW / s.sheetLength, availH / s.sheetWidth);
  const ox = (W - s.sheetLength * scale) / 2;
  const oy = titleH + margin;

  ctx.fillStyle = '#e8ecf4';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`${s.sheetLength} × ${s.sheetWidth}`, ox, oy - 10);

  // Sheet bg
  ctx.fillStyle = '#fff';
  ctx.fillRect(ox, oy, s.sheetLength * scale, s.sheetWidth * scale);

  // Hatch
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  for (let i = -s.sheetWidth * scale; i < s.sheetLength * scale; i += 14) {
    ctx.beginPath();
    ctx.moveTo(ox + Math.max(0, i), oy + (i < 0 ? -i : 0));
    ctx.lineTo(ox + Math.min(s.sheetLength * scale, i + s.sheetWidth * scale), oy + Math.min(s.sheetWidth * scale, s.sheetWidth * scale - (i > 0 ? 0 : i)));
    ctx.stroke();
  }

  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(ox, oy, s.sheetLength * scale, s.sheetWidth * scale);

  s.parts.forEach((p, idx) => {
    const px = ox + p.x * scale, py = oy + p.y * scale;
    const pw = p.width * scale, ph = p.height * scale;
    ctx.fillStyle = COLORS[Math.abs(hashCode(p.name)) % COLORS.length];
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px, py, pw, ph);

    ctx.fillStyle = '#0033CC';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    if (pw > 30) ctx.fillText(Math.round(p.width), px + pw / 2, py + 14);
    if (ph > 30) {
      ctx.save();
      ctx.translate(px + 12, py + ph / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(Math.round(p.height), 0, 0);
      ctx.restore();
    }
    ctx.fillStyle = '#111';
    ctx.textAlign = 'right';
    ctx.font = '10px sans-serif';
    if (pw > 40 && ph > 24) ctx.fillText(p.name + (p.rotated ? ' ↻' : ''), px + pw - 4, py + ph - 6);
  });
  ctx.textAlign = 'left';
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h) + str.charCodeAt(i);
  return h;
}

function resizeCutCanvas() { drawCutSheet(); }

function exportCutPng() {
  if (!sheets.length) { toast('Сначала рассчитайте'); return; }
  const canvas = $('cutCanvas');
  const a = document.createElement('a');
  a.download = `raskroy_list_${currentSheet + 1}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('PNG сохранён');
}

function isFloor(t) {

    case T.HOOD: m.w = 600; m.h = 400; m.d = 400; break;
    case T.DISH: m.w = 600; m.h = 850; m.d = 600; m.doors = 1; break;

function rebuildLayout() {
  let f0 = false, f1 = false, u0 = false, u1 = false, mz0 = false, mz1 = false;
  modules.forEach(m => {
    if ([T.COUNTER, T.SINK, T.COOK, T.BACKSPLASH].includes(m.type)) return;
    const floor = isFloor(m.type);
    if (m.wall === 0) { if (floor) f0 = true; else if (m.type === T.MEZZ) mz0 = true; else u0 = true; }
    else { if (floor) f1 = true; else if (m.type === T.MEZZ) mz1 = true; else u1 = true; }
  });
  const hasCornerFloor = f0 && f1;
  const hasCornerUpper = (u0 && u1) || (hasCornerFloor && (u0 || u1));
  const hasCornerMezz = (mz0 && mz1) || ((hasCornerFloor || hasCornerUpper) && (mz0 || mz1));
  const cornerFloorSize = hasCornerFloor ? 600 : 0;
  const cornerUpperSize = hasCornerUpper ? 300 : 0;
  const cornerMezzSize = hasCornerMezz ? 300 : 0;

  let mFloorX = cornerFloorSize, sFloorZ = cornerFloorSize;
  let mWallX = cornerUpperSize, sWallZ = cornerUpperSize;
  let mMezzX = cornerMezzSize, sMezzZ = cornerMezzSize;
  let counterTop = 0, counterH = 40;

  modules.forEach(m => {
    if ([T.COUNTER, T.SINK, T.COOK, T.BACKSPLASH].includes(m.type)) return;
    const floor = isFloor(m.type);
    if (m.wall === 0) {
      if (floor) { m.x = mFloorX; m.z = 0; mFloorX += m.w; if (m.type !== T.FRIDGE && m.type !== T.TALL && m.y + m.h > counterTop) counterTop = m.y + m.h; }
      else if (m.type === T.MEZZ) { m.x = mMezzX; m.z = 0; mMezzX += m.w; }
      else { m.x = mWallX; m.z = 0; mWallX += m.w; }
    } else {
      if (floor) { m.x = 0; m.z = sFloorZ; sFloorZ += m.w; if (m.type !== T.FRIDGE && m.type !== T.TALL && m.y + m.h > counterTop) counterTop = m.y + m.h; }
      else if (m.type === T.MEZZ) { m.x = 0; m.z = sMezzZ; sMezzZ += m.w; }
      else { m.x = 0; m.z = sWallZ; sWallZ += m.w; }
    }
  });

  modules.forEach(m => {
    if (m.type === T.UPPER || m.type === T.MICRO) m.y = 1500;
    else if (m.type === T.HOOD) m.y = 1800;
    if ([T.UPPER, T.MICRO, T.HOOD].includes(m.type)) {
      modules.forEach(h => {
        if (h.type !== T.FRIDGE && h.type !== T.TALL) return;
        if (h.wall !== m.wall) return;
        const m0 = m.wall === 0 ? m.x : m.z, m1 = m0 + m.w;
        const h0 = h.wall === 0 ? h.x : h.z, h1 = h0 + h.w;
        if (m0 < h1 && m1 > h0 && h.y + h.h > m.y) m.y = h.y + h.h;
      });
    }
  });

  modules.forEach(m => {
    if (m.type !== T.MEZZ) return;
    let maxYBelow = 2200;
    modules.forEach(below => {
      if (below === m || below.wall !== m.wall) return;
      const m0 = m.wall === 0 ? m.x : m.z, m1 = m0 + m.w;
      const b0 = below.wall === 0 ? below.x : below.z, b1 = b0 + below.w;
      if (m0 < b1 && m1 > b0) {
        const topEdge = below.y + below.h;
        if (topEdge > maxYBelow) maxYBelow = topEdge;
      }
    });
    m.y = maxYBelow;
  });

  let counterEndX = 0, sideEndZ = 0, stopX = Infinity, stopZ = Infinity;
  modules.forEach(m => {
    if ([T.COUNTER, T.SINK, T.COOK].includes(m.type)) return;
    if (m.type === T.FRIDGE || m.type === T.TALL) {
      if (m.wall === 0 && m.x < stopX) stopX = m.x;
      else if (m.wall === 1 && m.z < stopZ) stopZ = m.z;
      return;
    }
    if (m.wall === 0 && isFloor(m.type)) { if (m.x + m.w > counterEndX) counterEndX = m.x + m.w; }
    else if (m.wall === 1 && isFloor(m.type)) { if (m.z + m.w > sideEndZ) sideEndZ = m.z + m.w; }
  });
  if (stopX < Infinity && stopX < counterEndX) counterEndX = stopX;
  if (stopZ < Infinity && stopZ < sideEndZ) sideEndZ = stopZ;
  if (counterTop <= 0) counterTop = 850;

  modules.forEach(m => {
    if (m.type === T.COUNTER) {
      if (m.wall === 0) { m.x = hasCornerFloor ? 600 : 0; m.z = 0; m.w = Math.max(200, counterEndX - m.x); m.d = 600; }
      else { m.x = 0; m.z = hasCornerFloor ? 600 : 0; m.w = Math.max(200, sideEndZ - m.z); m.d = 600; }
      m.y = counterTop; m.h = counterH;
    }
  });
  const topSurface = counterTop + counterH;
  modules.forEach(m => {
    if (m.type === T.SINK || m.type === T.COOK) {
      m.y = topSurface;
      if (m.host && modules.includes(m.host)) {
        m.wall = m.host.wall;
        if (m.host.wall === 0) { m.x = m.host.x + (m.host.w - m.w) / 2; m.z = m.host.z + (m.host.d - m.d) / 2; }
        else { m.x = m.host.x + (m.host.d - m.d) / 2; m.z = m.host.z + (m.host.w - m.w) / 2; }
      } else { m.wall = 0; m.x = (f0 && f1 ? 620 : 20); m.z = 50; }
    }
  });

  // Corners
  cornerModules = [];
  let col = 0;
  for (const m of modules) { if (m.bodyColor) { col = m.bodyColor; break; } }
  if (hasCornerFloor) {
    cornerModules.push({ type: T.LOWER, name: 'Угловой шкаф', wall: 2, x: 0, z: 0, w: 600, d: 600, y: 0, h: counterTop, bodyColor: col, doors: 0 });
    cornerModules.push({ type: T.COUNTER, name: 'Угловая столешница', wall: 2, x: 0, z: 0, w: 600, d: 600, y: counterTop, h: 40, bodyColor: col });
  }
  let upperY = 1500, upperH = 700;
  for (const m of modules) if (m.type === T.UPPER || m.type === T.MICRO) { upperY = m.y; upperH = m.h; break; }
  if (hasCornerUpper) {
    cornerModules.push({ type: T.UPPER, name: 'Угловой верх', wall: 2, x: 0, z: 0, w: 300, d: 300, y: upperY, h: upperH, bodyColor: col, doors: 0 });
  }
  let mezzY = 2200, mezzH = 400;
  for (const m of modules) if (m.type === T.MEZZ) { mezzY = m.y; mezzH = m.h; break; }
  if (hasCornerMezz) {
    cornerModules.push({ type: T.MEZZ, name: 'Угловая антресоль', wall: 2, x: 0, z: 0, w: 300, d: 300, y: mezzY, h: mezzH, bodyColor: col, doors: 0 });
  }
}

function handleName(s) {
  return ['Круглые', 'Рейлинги', 'Без ручек'][s] || '—';
}
function refreshModulesList() {
  const list = $('modulesList');
  list.innerHTML = '';
  if (!modules.length) {
    list.innerHTML = `<div style="padding:16px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;border:1px dashed var(--border);border-radius:10px;margin:4px 0">
      Список пуст<br><span style="font-size:11px">Нажмите кнопки модулей выше —<br>шкафы появятся здесь для редактирования</span>
    </div>`;
    return;
  }
  modules.forEach((m, i) => {
    const col = m.bodyColor || typeColor(m.type);
    const hex = '#' + (col & 0xFFFFFF).toString(16).padStart(6, '0');
    const doorsTxt = hasFacade(m.type) ? (m.doors === 1 ? '1 ств.' : '2 ств.') : '';
    const handleTxt = (hasFacade(m.type) || m.type === T.DRAWERS || m.type === T.TALL) ? handleName(m.handleStyle) : '';
    const wallTxt = m.wall === 1 ? 'угловая' : (m.wall === 0 ? 'основная' : '');
    const extra = m.type === T.DRAWERS ? `${m.drawers} ящ.` : (m.type === T.TALL ? ((m.hasOven?'духовка ':'')+(m.hasMicro?'СВЧ':'')) : '');
    const item = document.createElement('div');
    item.className = 'mod-item';
    item.onclick = (e) => { if (!e.target.closest('button')) editModule(i); };
    item.innerHTML = `
      <div class="color-dot" style="background:${hex}"></div>
      <div class="info">
        <div class="title">${m.name}</div>
        <div class="meta">${Math.round(m.w)}×${Math.round(m.h)}×${Math.round(m.d)} мм
          ${doorsTxt ? ' · '+doorsTxt : ''} ${handleTxt ? ' · '+handleTxt : ''}
          ${wallTxt ? ' · '+wallTxt : ''} ${extra ? ' · '+extra : ''}
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-sm" onclick="event.stopPropagation();editModule(${i})" title="Редактировать">✎</button>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteModule(${i})" title="Удалить">✕</button>
      </div>`;
    list.appendChild(item);
  });
}

function editModule(i) {
  closeListDialog();
  editingModule = modules[i];
  isNewModule = false;
  openModuleModal(editingModule, false);
}
function deleteModule(i) {
  const removed = modules[i];
  modules.forEach(m => { if (m.host === removed) m.host = null; });
  modules.splice(i, 1);
  rebuildLayout();
  refreshModulesList();
  drawKitchen();
}
function clearKitchen() {
  if (!confirm('Очистить все модули?')) return;
  modules = []; cornerModules = [];
  refreshModulesList();
  drawKitchen();
}

/* ---- 3D Renderer ---- */
const LIGHT = { x: 0.45, y: 0.75, z: -0.48 };
const AMBIENT = 0.38, DIFFUSE = 0.62;

function litColor(baseCol, w0, w1, w2) {
  const e1x = w1[0]-w0[0], e1y = w1[1]-w0[1], e1z = w1[2]-w0[2];
  const e2x = w2[0]-w0[0], e2y = w2[1]-w0[1], e2z = w2[2]-w0[2];
  let nx = e1y*e2z - e1z*e2y, ny = e1z*e2x - e1x*e2z, nz = e1x*e2y - e1y*e2x;
  const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
  nx /= len; ny /= len; nz /= len;
  let ndotl = nx*LIGHT.x + ny*LIGHT.y + nz*LIGHT.z;
  if (ndotl < 0) ndotl = 0;
  let intensity = AMBIENT + DIFFUSE * ndotl;
  if (ny > 0.7) intensity = Math.min(1.05, intensity + 0.08);
  const r = Math.min(255, ((baseCol >> 16) & 0xFF) * intensity | 0);
  const g = Math.min(255, ((baseCol >> 8) & 0xFF) * intensity | 0);
  const b = Math.min(255, (baseCol & 0xFF) * intensity | 0);
  return (0xFF << 24) | (r << 16) | (g << 8) | b;
}

function toWorld(m, lx, ly, lz) {
  let wx, wy = m.y + ly, wz;
  if (m.wall === 0) { wx = m.x + lx; wz = m.z + lz; }
  else if (m.wall === 1) { wx = m.x + lz; wz = m.z + lx; }
  else { wx = m.x + lx; wz = m.z + lz; }
  if (flipX) wx = -wx;
  return [wx, wy, wz];
}

function proj(x, y, z) {
  const cyaw = Math.cos(kYaw), syaw = Math.sin(kYaw);
  const cp = Math.cos(kPitch), sp = Math.sin(kPitch);
  const rx = x * cyaw - z * syaw;
  const rz = x * syaw + z * cyaw;
  const camY = y * cp - rz * sp;
  const camZ = -(y * sp + rz * cp);
  let persp = 1 + camZ * 0.00030;
  if (persp < 0.6) persp = 0.6;
  if (persp > 1.8) persp = 1.8;
  const canvas = $('kitchenCanvas');
  return {
    x: canvas.clientWidth / 2 + (rx * kSc * kZoom) / persp,
    y: canvas.clientHeight / 2 - (camY * kSc * kZoom) / persp,
    z: camZ
  };
}

function drawKitchen() {
  const canvas = $('kitchenCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rect.width, H = rect.height;

  ctx.fillStyle = '#141926';
  ctx.fillRect(0, 0, W, H);

  const all = modules.concat(cornerModules);
  if (!all.length) {
    ctx.fillStyle = '#8899BB';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Добавьте модули кнопками слева', W / 2, H / 2);
    return;
  }

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  all.forEach(m => {
    [[0,0,0],[m.w,0,0],[0,m.h,0],[m.w,m.h,0],[0,0,m.d],[m.w,0,m.d],[0,m.h,m.d],[m.w,m.h,m.d]].forEach(c => {
      const w = toWorld(m, c[0], c[1], c[2]);
      if (w[0] < minX) minX = w[0]; if (w[0] > maxX) maxX = w[0];
      if (w[1] < minY) minY = w[1]; if (w[1] > maxY) maxY = w[1];
      if (w[2] < minZ) minZ = w[2]; if (w[2] > maxZ) maxZ = w[2];
    });
  });
  kCx = (minX + maxX) / 2; kCy = (minY + maxY) / 2; kCz = (minZ + maxZ) / 2;
  const spanX = Math.max(400, maxX - minX), spanY = Math.max(400, maxY - minY), spanZ = Math.max(400, maxZ - minZ);
  kSc = Math.min((W - 140) / Math.max(spanX, spanZ), (H - 200) / spanY) * 0.82;

  const items = [];

  // layer: 0=room, 1=cabinets, 2=counter, 3=sink/cook glass, 4=burners+handles (always on top)
  function addQuad(w0, w1, w2, w3, fillCol, strokeCol, sw, depthOff, layer) {
    const shaded = litColor(fillCol, w0, w1, w2);
    const p0 = proj(w0[0]-kCx, w0[1]-kCy, w0[2]-kCz);
    const p1 = proj(w1[0]-kCx, w1[1]-kCy, w1[2]-kCz);
    const p2 = proj(w2[0]-kCx, w2[1]-kCy, w2[2]-kCz);
    const p3 = proj(w3[0]-kCx, w3[1]-kCy, w3[2]-kCz);
    // use nearest vertex depth — more stable for thin horizontal surfaces when rotating
    const nearest = Math.min(p0.z, p1.z, p2.z, p3.z);
    const avg = (p0.z + p1.z + p2.z + p3.z) / 4;
    items.push({
      type: 0,
      depth: avg + (depthOff || 0),
      nearest: nearest + (depthOff || 0),
      layer: (layer === undefined || layer === null) ? 1 : layer,
      px: [p0.x, p1.x, p2.x, p3.x], py: [p0.y, p1.y, p2.y, p3.y],
      fill: shaded, stroke: strokeCol, sw: sw || 1
    });
  }
  function addLine(w0, w1, col, sw, depthOff, layer) {
    const p0 = proj(w0[0]-kCx, w0[1]-kCy, w0[2]-kCz);
    const p1 = proj(w1[0]-kCx, w1[1]-kCy, w1[2]-kCz);
    items.push({
      type: 1,
      depth: (p0.z + p1.z) / 2 + (depthOff || 0),
      nearest: Math.min(p0.z, p1.z) + (depthOff || 0),
      layer: (layer === undefined || layer === null) ? 1 : layer,
      px: [p0.x, p1.x], py: [p0.y, p1.y], stroke: col, sw: sw || 1
    });
  }
  function addCircle(w0, r, fill, stroke, sw, depthOff, layer) {
    const p0 = proj(w0[0]-kCx, w0[1]-kCy, w0[2]-kCz);
    items.push({
      type: 2, depth: p0.z + (depthOff || 0), nearest: p0.z + (depthOff || 0),
      layer: (layer === undefined || layer === null) ? 1 : layer,
      px: [p0.x], py: [p0.y], r, fill, stroke, sw: sw || 1
    });
  }
  /** Horizontal ring on module top plane (XZ) — layer 4 so glass can't cover burners */
  function addHRing(m, lx, ly, lz, radius, col, sw, segs, depthOff) {
    const n = segs || 24;
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const pt = toWorld(m, lx + Math.cos(a) * radius, ly, lz + Math.sin(a) * radius);
      if (prev) addLine(prev, pt, col, sw || 1.5, depthOff || -200, 4);
      prev = pt;
    }
  }

  // Floor & walls (layer 0 — farthest)
  const pad = 420, floorY = 0, wallTopY = maxY + pad;
  addQuad([minX-pad, floorY, minZ-pad], [maxX+pad, floorY, minZ-pad], [maxX+pad, floorY, maxZ+pad], [minX-pad, floorY, maxZ+pad], 0xFF2A2F3A, 0x33222833, 1.2, 5000, 0);
  for (let gx = minX - pad + 300; gx < maxX + pad; gx += 300)
    addLine([gx, 1, minZ-pad], [gx, 1, maxZ+pad], 0x22FFFFFF, 1, 4990, 0);
  for (let gz = minZ - pad + 300; gz < maxZ + pad; gz += 300)
    addLine([minX-pad, 1, gz], [maxX+pad, 1, gz], 0x22FFFFFF, 1, 4990, 0);
  addQuad([minX-pad, floorY, minZ-pad], [maxX+pad, floorY, minZ-pad], [maxX+pad, wallTopY, minZ-pad], [minX-pad, wallTopY, minZ-pad], 0xFF2C3344, 0x332E3952, 1.2, 4800, 0);
  const sideX = flipX ? (maxX + pad) : (minX - pad);
  addQuad([sideX, floorY, minZ-pad], [sideX, floorY, maxZ+pad], [sideX, wallTopY, maxZ+pad], [sideX, wallTopY, minZ-pad], 0xFF262C3A, 0x332E3952, 1.2, 4800, 0);

  // Modules
  all.forEach(m => {
    const col = m.bodyColor || typeColor(m.type);
    const w = m.w, h = m.h, d = m.d;
    const isCustom = [T.SINK, T.COOK, T.BACKSPLASH].includes(m.type);
    const edge = 0x33000000;
    // counters sit above cabinets; sink/cook above counters
    const bodyLayer = (m.type === T.COUNTER) ? 2 : 1;
    // top face of counter gets extra pull-forward bias so it doesn't hole-punch when rotating
    const topBias = (m.type === T.COUNTER) ? -120 : 0;

    if (!isCustom) {
      if (m.wall === 2) {
        addQuad(toWorld(m,0,h,d), toWorld(m,w,h,d), toWorld(m,w,h,0), toWorld(m,0,h,0), col, edge, 1.1, topBias, bodyLayer);
        addQuad(toWorld(m,0,0,0), toWorld(m,w,0,0), toWorld(m,w,0,d), toWorld(m,0,0,d), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,w,0,0), toWorld(m,0,0,0), toWorld(m,0,h,0), toWorld(m,w,h,0), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,0,0,0), toWorld(m,0,0,d), toWorld(m,0,h,d), toWorld(m,0,h,0), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,0,0,d), toWorld(m,w,0,d), toWorld(m,w,h,d), toWorld(m,0,h,d), col, edge, 1.1, 0, bodyLayer);
        addQuad(toWorld(m,w,0,d), toWorld(m,w,0,0), toWorld(m,w,h,0), toWorld(m,w,h,d), col, edge, 1.1, 0, bodyLayer);
      } else {
        addQuad(toWorld(m,0,0,d), toWorld(m,w,0,d), toWorld(m,w,h,d), toWorld(m,0,h,d), col, edge, 1.1, 0, bodyLayer);
        addQuad(toWorld(m,w,0,0), toWorld(m,0,0,0), toWorld(m,0,h,0), toWorld(m,w,h,0), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,0,h,d), toWorld(m,w,h,d), toWorld(m,w,h,0), toWorld(m,0,h,0), col, edge, 1.1, topBias, bodyLayer);
        addQuad(toWorld(m,0,0,0), toWorld(m,w,0,0), toWorld(m,w,0,d), toWorld(m,0,0,d), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,0,0,0), toWorld(m,0,0,d), toWorld(m,0,h,d), toWorld(m,0,h,0), col, edge, 1, 0, bodyLayer);
        addQuad(toWorld(m,w,0,d), toWorld(m,w,0,0), toWorld(m,w,h,0), toWorld(m,w,h,d), col, edge, 1, 0, bodyLayer);
      }
    }

    // Metal handles — layer 4 so facades never paint over them when rotating
    function drawHandle(hx, hy, hz, style, vertical, len) {
      const metal = 0xFF3A3A3A;
      const hi = 0xFF9E9E9E;
      const L = 4, bias = -250;
      if (style === 2) return;
      if (style === 0) {
        addLine(toWorld(m, hx, hy, hz + 1), toWorld(m, hx, hy, hz + 10), metal, 3.5, bias, L);
        addLine(toWorld(m, hx - 6, hy, hz + 10), toWorld(m, hx + 6, hy, hz + 10), metal, 3.0, bias - 1, L);
        addLine(toWorld(m, hx, hy - 6, hz + 10), toWorld(m, hx, hy + 6, hz + 10), metal, 3.0, bias - 1, L);
      } else {
        const half = (len || 56) / 2;
        if (vertical) {
          addLine(toWorld(m, hx, hy - half, hz + 7), toWorld(m, hx, hy + half, hz + 7), metal, 3.5, bias, L);
          addLine(toWorld(m, hx - 1, hy - half, hz + 8), toWorld(m, hx - 1, hy + half, hz + 8), hi, 1.2, bias - 1, L);
          addLine(toWorld(m, hx - 4, hy - half, hz + 6), toWorld(m, hx + 4, hy - half, hz + 6), metal, 2.5, bias + 1, L);
          addLine(toWorld(m, hx - 4, hy + half, hz + 6), toWorld(m, hx + 4, hy + half, hz + 6), metal, 2.5, bias + 1, L);
        } else {
          addLine(toWorld(m, hx - half, hy, hz + 7), toWorld(m, hx + half, hy, hz + 7), metal, 3.5, bias, L);
          addLine(toWorld(m, hx - half, hy - 1, hz + 8), toWorld(m, hx + half, hy - 1, hz + 8), hi, 1.2, bias - 1, L);
          addLine(toWorld(m, hx - half, hy - 4, hz + 6), toWorld(m, hx - half, hy + 4, hz + 6), metal, 2.5, bias + 1, L);
          addLine(toWorld(m, hx + half, hy - 4, hz + 6), toWorld(m, hx + half, hy + 4, hz + 6), metal, 2.5, bias + 1, L);
        }
      }
    }

    // Facades & details
    if (m.type === T.DRAWERS) {
      const dh = (h - 6) / m.drawers;
      for (let k = 0; k < m.drawers; k++) {
        const y0 = 3 + k * dh, y1 = y0 + dh - 4;
        // slightly recessed drawer front
        addQuad(toWorld(m, 3, y0, d + 1.5), toWorld(m, w - 3, y0, d + 1.5), toWorld(m, w - 3, y1, d + 1.5), toWorld(m, 3, y1, d + 1.5), col, 0xFF1A1A1A, 1.2, -2);
        // thin top edge highlight
        addLine(toWorld(m, 5, y1 - 1, d + 2.5), toWorld(m, w - 5, y1 - 1, d + 2.5), 0x33FFFFFF, 1.0, -3);
        const midY = (y0 + y1) / 2;
        if (m.handleStyle === 2) {
          // gola profile shadow under drawer
          addLine(toWorld(m, 8, y0 + 2, d + 2), toWorld(m, w - 8, y0 + 2, d + 2), 0x66000000, 2.0, -5);
        } else {
          drawHandle(w / 2, midY, d, m.handleStyle, false, Math.min(120, w * 0.35));
        }
      }
    } else if (m.type === T.OVEN) {
      addQuad(toWorld(m,2,2,d+2), toWorld(m,w-2,2,d+2), toWorld(m,w-2,h*0.18,d+2), toWorld(m,2,h*0.18,d+2), 0xFF2A2A2A, 0xFF111111, 1.3, -2);
      addQuad(toWorld(m,2,h*0.2,d+2), toWorld(m,w-2,h*0.2,d+2), toWorld(m,w-2,h*0.82,d+2), toWorld(m,2,h*0.82,d+2), 0xFF121212, 0xFF0A0A0A, 1.3, -2);
      addQuad(toWorld(m,w*0.12,h*0.25,d+4), toWorld(m,w*0.88,h*0.25,d+4), toWorld(m,w*0.88,h*0.75,d+4), toWorld(m,w*0.12,h*0.75,d+4), 0xFF263238, 0xFF1A1A1A, 1.3, -3);
      // glass reflection
      addQuad(toWorld(m,w*0.14,h*0.28,d+5), toWorld(m,w*0.45,h*0.28,d+5), toWorld(m,w*0.45,h*0.55,d+5), toWorld(m,w*0.14,h*0.55,d+5), 0x22FFFFFF, 0, 0, -4);
      addLine(toWorld(m,w*0.15,h*0.78,d+7), toWorld(m,w*0.85,h*0.78,d+7), 0xFFE0E0E0, 4.5, -6);
      addQuad(toWorld(m,2,h*0.84,d+2), toWorld(m,w-2,h*0.84,d+2), toWorld(m,w-2,h-2,d+2), toWorld(m,2,h-2,d+2), 0xFF1E1E1E, 0xFF111111, 1.3, -2);
      addCircle(toWorld(m,w*0.28,h*0.92,d+5), 4.5, 0xFFECEFF1, 0xFF333333, 1.0, -4);
      addCircle(toWorld(m,w*0.72,h*0.92,d+5), 4.5, 0xFFECEFF1, 0xFF333333, 1.0, -4);
    } else if (m.type === T.FRIDGE) {
      const fc = m.bodyColor || 0xFFCFD8DC;
      addQuad(toWorld(m,2,2,d+2), toWorld(m,w-2,2,d+2), toWorld(m,w-2,h*0.58-2,d+2), toWorld(m,2,h*0.58-2,d+2), fc, 0xFF455A64, 1.3, -2);
      addQuad(toWorld(m,2,h*0.58+2,d+2), toWorld(m,w-2,h*0.58+2,d+2), toWorld(m,w-2,h-2,d+2), toWorld(m,2,h-2,d+2), fc, 0xFF455A64, 1.3, -2);
      // vertical handles — layer 4 so doors never cover them
      addLine(toWorld(m,w-22,h*0.52,d+7), toWorld(m,w-22,h*0.38,d+7), 0xFF455A64, 4.5, -250, 4);
      addLine(toWorld(m,w-26,h*0.52,d+6), toWorld(m,w-18,h*0.52,d+6), 0xFF455A64, 2.5, -250, 4);
      addLine(toWorld(m,w-26,h*0.38,d+6), toWorld(m,w-18,h*0.38,d+6), 0xFF455A64, 2.5, -250, 4);
      addLine(toWorld(m,w-22,h*0.68,d+7), toWorld(m,w-22,h*0.82,d+7), 0xFF455A64, 4.5, -250, 4);
      addLine(toWorld(m,w-26,h*0.68,d+6), toWorld(m,w-18,h*0.68,d+6), 0xFF455A64, 2.5, -250, 4);
      addLine(toWorld(m,w-26,h*0.82,d+6), toWorld(m,w-18,h*0.82,d+6), 0xFF455A64, 2.5, -250, 4);
    } else if (m.type === T.MICRO) {

        addQuad(toWorld(m,2,topY0+2,d+2), toWorld(m,w-2,topY0+2,d+2), toWorld(m,w-2,h-2,d+2), toWorld(m,2,h-2,d+2), tc, 0xFF222222, 1.3, -2);

        if (m.handleStyle !== 2) {

        }
      }
    } else if (hasFacade(m.type) && m.doors > 0) {
      const gap = 3;
      if (m.doors === 2) {

        const hy = isFloor(m.type) ? h - 65 : 65;
        if (m.handleStyle === 2) {
          // gola / push-to-open thin line
          const gy = isFloor(m.type) ? h - 4 : 4;
          addLine(toWorld(m, 10, gy, d + 2.5), toWorld(m, w - 10, gy, d + 2.5), 0x55000000, 2.0, -5);

        addQuad(toWorld(m, 3, 3, d + 1.5), toWorld(m, w - 3, 3, d + 1.5), toWorld(m, w - 3, h - 3, d + 1.5), toWorld(m, 3, h - 3, d + 1.5), col, 0xFF1A1A1A, 1.2, -2);

        }
      }

    if (m.type === T.SINK) {
      // layer 3 + strong bias: always above counter when rotating
      addQuad(toWorld(m,0,1,0), toWorld(m,w,1,0), toWorld(m,w,1,d), toWorld(m,0,1,d), 0xFFB0BEC5, 0xFF455A64, 1.5, -150, 3);
      addQuad(toWorld(m,w*0.12,2,d*0.15), toWorld(m,w*0.88,2,d*0.15), toWorld(m,w*0.88,2,d*0.85), toWorld(m,w*0.12,2,d*0.85), 0xFF78909C, 0xFF37474F, 1.5, -160, 3);
      addCircle(toWorld(m,w/2,3,d*0.5), 9, 0xFF455A64, 0xFF263238, 1.2, -170, 3);
      addLine(toWorld(m,w/2,2,d*0.14), toWorld(m,w/2,180,d*0.14), 0xFFECEFF1, 6, -180, 3);
      addLine(toWorld(m,w/2,180,d*0.14), toWorld(m,w/2,160,d*0.45), 0xFFECEFF1, 5, -180, 3);
    } else if (m.type === T.COOK) {
      addQuad(toWorld(m,0,2,0), toWorld(m,w,2,0), toWorld(m,w,2,d), toWorld(m,0,2,d), 0xFF1A1A1A, 0xFF333333, 1.3, -150, 3);
      addQuad(toWorld(m,4,3,4), toWorld(m,w-4,3,4), toWorld(m,w-4,3,d-4), toWorld(m,4,3,d-4), 0xFF0D0D0D, 0xFF222222, 1.0, -160, 3);
      const burners = [
        [0.28, 0.30, 55, 28],
        [0.72, 0.30, 48, 24],
        [0.28, 0.70, 48, 24],
        [0.72, 0.70, 60, 32]
      ];
      burners.forEach(([cx, cz, rOut, rIn]) => {
        const x = w * cx, z = d * cz;
        addHRing(m, x, 4, z, rOut, 0xFF4A4A4A, 2.2, 28, -170);
        addHRing(m, x, 4, z, rOut - 3, 0xFF2A2A2A, 1.5, 28, -171);
        addHRing(m, x, 4.5, z, (rOut + rIn) / 2, 0xFFB71C1C, 2.0, 24, -172);
        addHRing(m, x, 4, z, rIn, 0xFF555555, 1.8, 20, -173);
        addHRing(m, x, 4, z, rIn * 0.45, 0xFF333333, 1.2, 16, -174);
      });
      addLine(toWorld(m, w * 0.2, 4, d * 0.08), toWorld(m, w * 0.8, 4, d * 0.08), 0xFF444444, 2.0, -200, 4);
    } else if (m.type === T.BACKSPLASH) {
      const base = m.bodyColor || 0xFFB0BEC5;
      addQuad(toWorld(m,0,0,d), toWorld(m,w,0,d), toWorld(m,w,h,d), toWorld(m,0,h,d), base, 0xFF37474F, 1.5, -1);
      const tw = m.tileStyle === 1 ? 600 : (m.tileStyle === 2 ? 1200 : 100);
      const th = m.tileStyle === 0 ? 100 : 600;
      for (let xx = tw; xx < w; xx += tw) addLine(toWorld(m,xx,0,d+1), toWorld(m,xx,h,d+1), 0xFF37474F, 1.5, -2);
      for (let yy = th; yy < h; yy += th) addLine(toWorld(m,0,yy,d+1), toWorld(m,w,yy,d+1), 0xFF37474F, 1.5, -2);
    }
  });

  // Sort: far → near, but higher layer always draws later (on top)
  // Fixes sink/cook/counter disappearing when rotating (painter algorithm holes)
  items.sort((a, b) => {
    if (a.layer !== b.layer) return a.layer - b.layer;
    return b.depth - a.depth;
  });
  items.forEach(it => {
    if (it.type === 0) {
      ctx.beginPath();
      ctx.moveTo(it.px[0], it.py[0]);
      for (let i = 1; i < 4; i++) ctx.lineTo(it.px[i], it.py[i]);
      ctx.closePath();
      if (it.fill) {
        const c = it.fill;
        ctx.fillStyle = `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},1)`;
        ctx.fill();
      }
      if (it.stroke && it.sw) {
        const c = it.stroke;
        ctx.strokeStyle = `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},${((c>>24)&255)/255})`;
        ctx.lineWidth = it.sw;
        ctx.stroke();
      }
    } else if (it.type === 1) {
      const c = it.stroke;
      ctx.strokeStyle = `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},${((c>>24)&255)/255 || 1})`;
      ctx.lineWidth = it.sw;
      ctx.beginPath();
      ctx.moveTo(it.px[0], it.py[0]);
      ctx.lineTo(it.px[1], it.py[1]);
      ctx.stroke();
    } else if (it.type === 2) {
      if (it.fill) {
        const c = it.fill;
        ctx.fillStyle = `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},1)`;
        ctx.beginPath(); ctx.arc(it.px[0], it.py[0], it.r, 0, Math.PI*2); ctx.fill();
      }
      if (it.stroke) {
        const c = it.stroke;
        ctx.strokeStyle = `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},1)`;
        ctx.lineWidth = it.sw;
        ctx.beginPath(); ctx.arc(it.px[0], it.py[0], it.r, 0, Math.PI*2); ctx.stroke();
      }
    }
  });
}

function setKitchenView(k) {
  if (k === 0) { kPitch = 1.45; kYaw = 0; }
  else if (k === 1) { kPitch = 0.05; kYaw = 0; }
  else { kPitch = 0.35; kYaw = -0.55; }
  kZoom = 1;
  drawKitchen();
}
function resetKitchenCam() { kYaw = -0.55; kPitch = 0.35; kZoom = 1; drawKitchen(); }

/* Camera controls */
(function() {
  const canvas = $('kitchenCanvas');
  let dragging = false, lastX = 0, lastY = 0, lastDist = 0;

  canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    kYaw += (e.clientX - lastX) * 0.007;
    kPitch += (lastY - e.clientY) * 0.007;
    kPitch = Math.max(0.02, Math.min(1.54, kPitch));
    lastX = e.clientX; lastY = e.clientY;
    drawKitchen();
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    kZoom *= e.deltaY > 0 ? 0.9 : 1.1;
    kZoom = Math.max(0.4, Math.min(4, kZoom));
    drawKitchen();
  }, { passive: false });

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
    else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastDist = Math.hypot(dx, dy);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      kYaw += (e.touches[0].clientX - lastX) * 0.007;
      kPitch += (lastY - e.touches[0].clientY) * 0.007;
      kPitch = Math.max(0.02, Math.min(1.54, kPitch));
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      drawKitchen();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (lastDist > 0) {
        kZoom *= dist / lastDist;
        kZoom = Math.max(0.4, Math.min(4, kZoom));
        drawKitchen();
      }
      lastDist = dist;
    }
  }, { passive: false });
})();

/* iOS Safari click reliability:
   - touch-action: manipulation (CSS) removes 300ms delay
   - empty touchstart makes non-link elements fully tappable
   - for buttons over canvas: stopPropagation so canvas doesn't steal the gesture */
(function fixIOSButtons() {
  const SEL = 'button, .btn, .tab, .module-btns button, .k-controls a, .k-bottom-bar a, [onclick], label.btn, .mod-item .actions button, a[href^="javascript"]';
  function wire(el) {
    if (!el || el.dataset.iosWired) return;
    el.dataset.iosWired = '1';
    // Activates iOS "clickability" for the element (Apple quirk)
    el.addEventListener('touchstart', function () {}, { passive: true });
    // Keep taps from bubbling to canvas / other handlers
    el.addEventListener('touchend', function (e) {
      e.stopPropagation();
    }, { passive: true });
  }
  function scan() { document.querySelectorAll(SEL).forEach(wire); }
  scan();
  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
})();

/* ========== Projects (multi-save + share file) ========== */
const PROJECTS_KEY = 'komfort_mebel_projects';
let currentProjectName = '';

function getProjectPayload() {
  return {
    app: 'КОМФОРТ МЕБЕЛЬ',
    version: 1,
    modules: modules.map(m => ({
      type: m.type, name: m.name, w: m.w, h: m.h, d: m.d, wall: m.wall,
      drawers: m.drawers, bodyColor: m.bodyColor, doors: m.doors,
      hasOven: m.hasOven, hasMicro: m.hasMicro, tileStyle: m.tileStyle,
      handleStyle: m.handleStyle, host: m.host ? modules.indexOf(m.host) : -1
    })),
    flipX
  };
}

function applyProjectData(data) {
  flipX = !!data.flipX;
  modules = (data.modules || []).map(o => ({
    type: o.type, name: o.name, w: o.w, h: o.h, d: o.d, wall: o.wall || 0,
    drawers: o.drawers || 3, bodyColor: o.bodyColor || 0, doors: o.doors || 2,
    hasOven: !!o.hasOven, hasMicro: !!o.hasMicro, tileStyle: o.tileStyle || 0,
    handleStyle: o.handleStyle != null ? o.handleStyle : 1, host: null, x: 0, y: 0, z: 0
  }));
  (data.modules || []).forEach((o, i) => {
    if (o.host >= 0 && o.host < modules.length) modules[i].host = modules[o.host];
  });
  rebuildLayout();
  refreshModulesList();
  drawKitchen();
}

function loadProjectsStore() {
  try {
    return JSON.parse(localStorage.getItem(PROJECTS_KEY) || '{}');
  } catch (e) { return {}; }
}
function saveProjectsStore(store) {
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(store));
}

function openSaveDialog() {
  $('saveProjectName').value = currentProjectName || '';
  $('saveModal').classList.add('show');
  setTimeout(() => { try { $('saveProjectName').focus(); } catch (e) {} }, 100);
}
function closeSaveDialog() { $('saveModal').classList.remove('show'); }

function saveNamedProject() {
  let name = ($('saveProjectName').value || '').trim();
  if (!name) { toast('Введите имя проекта'); return; }
  if (name.length > 60) name = name.slice(0, 60);
  const store = loadProjectsStore();
  store[name] = {
    ...getProjectPayload(),
    savedAt: new Date().toISOString()
  };
  saveProjectsStore(store);
  currentProjectName = name;
  closeSaveDialog();
  toast('Сохранено: «' + name + '»');
}

function openProjectsDialog() {
  renderProjectsList();
  $('projectsModal').classList.add('show');
}
function closeProjectsDialog() { $('projectsModal').classList.remove('show'); }

function renderProjectsList() {
  const list = $('projectsList');
  const store = loadProjectsStore();
  const names = Object.keys(store).sort((a, b) => {
    const ta = store[b].savedAt || '', tb = store[a].savedAt || '';
    return ta.localeCompare(tb);
  });
  if (!names.length) {
    list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px;text-align:center">Нет сохранённых проектов.<br>Нажмите «Сохранить» или «Открыть файл друга».</div>';
    return;
  }
  list.innerHTML = names.map(name => {
    const p = store[name];
    const n = (p.modules && p.modules.length) || 0;
    const date = p.savedAt ? new Date(p.savedAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const safe = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<div class="mod-item" onclick="openNamedProject('${safe}')">
      <div class="info" style="flex:1">
        <div class="title">${name.replace(/</g,'&lt;')}</div>
        <div class="meta">${n} модулей${date ? ' · ' + date : ''}</div>
      </div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();openNamedProject('${safe}')">Открыть</button>
        <button class="btn btn-sm" onclick="event.stopPropagation();exportNamedProject('${safe}')">⬇</button>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteNamedProject('${safe}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function openNamedProject(name) {
  const store = loadProjectsStore();
  if (!store[name]) { toast('Проект не найден'); return; }
  try {
    applyProjectData(store[name]);
    currentProjectName = name;
    closeProjectsDialog();
    toast('Открыт: «' + name + '»');
  } catch (e) { toast('Ошибка открытия'); }
}

function deleteNamedProject(name) {
  if (!confirm('Удалить проект «' + name + '»?')) return;
  const store = loadProjectsStore();
  delete store[name];
  saveProjectsStore(store);
  if (currentProjectName === name) currentProjectName = '';
  renderProjectsList();
  toast('Удалено');
}

function exportNamedProject(name) {
  const store = loadProjectsStore();
  if (!store[name]) return;
  const data = { ...store[name], name };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^\wа-яА-ЯёЁ\- ]+/g, '').trim().replace(/\s+/g, '_') + '.json';
  a.click();
  toast('Файл скачан: можно отправить другу');
}

function downloadKitchenJson() {
  const name = currentProjectName || 'kitchen_project';
  const data = { ...getProjectPayload(), name };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^\wа-яА-ЯёЁ\- ]+/g, '').trim().replace(/\s+/g, '_') + '.json';
  a.click();
  toast('Файл скачан — отправьте другу');
}

function uploadKitchenJson(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.modules || !Array.isArray(data.modules)) throw new Error('bad');
      applyProjectData(data);
      currentProjectName = data.name || file.name.replace(/\.json$/i, '') || '';
      // offer to keep a local copy
      if (currentProjectName) {
        const store = loadProjectsStore();
        store[currentProjectName] = { ...getProjectPayload(), savedAt: new Date().toISOString() };
        saveProjectsStore(store);
      }
      closeProjectsDialog();
      closeSaveDialog();
      toast('Проект загружен' + (currentProjectName ? ': «' + currentProjectName + '»' : ''));
    } catch (err) { toast('Не удалось прочитать файл'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// backward-compatible aliases
function saveKitchen() { openSaveDialog(); }
function loadKitchen() { openProjectsDialog(); }

/* Init */

(function migrateOldProject() {
  try {
    const old = localStorage.getItem('kitchen_studio_project');
    if (!old) return;
    const store = loadProjectsStore();
    if (!store['Автосохранение']) {
      const data = JSON.parse(old);
      store['Автосохранение'] = { ...data, savedAt: new Date().toISOString() };
      saveProjectsStore(store);
    }
    localStorage.removeItem('kitchen_studio_project');
  } catch (e) {}
})();
